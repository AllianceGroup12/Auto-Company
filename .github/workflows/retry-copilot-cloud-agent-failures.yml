name: Retry Copilot cloud agent failures

"on":
  workflow_run:
    workflows:
      - Running Copilot cloud agent
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  rerun-once:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.actor.id == 198982749
    runs-on: ubuntu-latest
    steps:
      - name: Re-run only transient pr_summary failures
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if ! FAILED_LOGS="$(gh run view "$RUN_ID" --repo "$REPO" --log-failed 2>&1)"; then
            echo "Failed to fetch failed logs; checking exact failed job/step shape."
            JOBS_JSON="$(gh api "/repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100")"
            SHOULD_RERUN="$(printf '%s' "$JOBS_JSON" | python3 -c 'import json, sys; data = json.load(sys.stdin); failed_jobs = [job for job in data.get(\"jobs\", []) if job.get(\"conclusion\") == \"failure\"]; ok = len(failed_jobs) == 1 and failed_jobs[0].get(\"name\") == \"copilot\"; failed_steps = [step for step in failed_jobs[0].get(\"steps\", []) if step.get(\"conclusion\") == \"failure\"] if ok else []; print(\"true\" if ok and len(failed_steps) == 1 and failed_steps[0].get(\"name\") == \"Processing Request (Linux)\" else \"false\")')"
            if [ "$SHOULD_RERUN" = "true" ]; then
              gh api --method POST "/repos/$REPO/actions/runs/$RUN_ID/rerun-failed-jobs"
              echo "Requested rerun based on exact copilot failure shape."
            else
              echo "Failed logs unavailable and failure shape did not match; not rerunning."
            fi
            exit 0
          fi
          if printf '%s' "$FAILED_LOGS" | grep -Fq "Failed to send pr_summary after 3 attempts"; then
            gh api --method POST "/repos/$REPO/actions/runs/$RUN_ID/rerun-failed-jobs"
            echo "Requested rerun for transient pr_summary failure."
          else
            echo "No transient pr_summary failure detected; not rerunning."
          fi
