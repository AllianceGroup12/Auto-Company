name: Retry Copilot cloud agent failures

"on":
  workflow_run:
    workflows:
      - Running Copilot cloud agent
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  rerun-once:
    # Stable GitHub App actor ID for the Copilot SWE agent.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.actor.id == 198982749
    runs-on: ubuntu-latest
    steps:
      - name: Re-run only transient pr_summary failures
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if ! FAILED_LOGS="$(gh run view "$RUN_ID" --repo "$REPO" --log-failed 2>&1)"; then
            echo "Failed to fetch failed logs; checking exact failed job/step shape."
            JOBS_JSON="$(gh api "/repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100")"
            FALLBACK_PARSER=$'import json\nimport sys\n\ndata = json.load(sys.stdin)\nfailed_jobs = [job for job in data.get("jobs", []) if job.get("conclusion") == "failure"]\nfailed_job_name = failed_jobs[0].get("name", "") if len(failed_jobs) == 1 else ""\nfailed_steps = [step for step in failed_jobs[0].get("steps", []) if step.get("conclusion") == "failure"] if len(failed_jobs) == 1 else []\nfailed_step_name = failed_steps[0].get("name", "") if len(failed_steps) == 1 else ""\nprint("\\t".join([str(len(failed_jobs)), failed_job_name, str(len(failed_steps)), failed_step_name]))'
            FALLBACK_FIELDS="$(printf '%s' "$JOBS_JSON" | python3 -c "$FALLBACK_PARSER")"
            IFS=$'\t' read -r FAILED_JOB_COUNT FAILED_JOB_NAME FAILED_STEP_COUNT FAILED_STEP_NAME <<< "$FALLBACK_FIELDS"
            if [ "$FAILED_JOB_COUNT" = "1" ] && [ "$FAILED_JOB_NAME" = "copilot" ] && [ "$FAILED_STEP_COUNT" = "1" ] && [ "$FAILED_STEP_NAME" = "Processing Request (Linux)" ]; then
              gh api --method POST "/repos/$REPO/actions/runs/$RUN_ID/rerun-failed-jobs"
              echo "Requested rerun based on exact copilot failure shape."
            else
              echo "Failed logs unavailable and failure shape did not match; not rerunning."
            fi
            exit 0
          fi
          if printf '%s' "$FAILED_LOGS" | grep -Fq "Failed to send pr_summary after 3 attempts"; then
            gh api --method POST "/repos/$REPO/actions/runs/$RUN_ID/rerun-failed-jobs"
            echo "Requested rerun for transient pr_summary failure."
          else
            echo "No transient pr_summary failure detected; not rerunning."
          fi
