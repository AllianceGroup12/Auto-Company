name: Retry Copilot cloud agent failures

"on":
  workflow_run:
    workflows:
      - Running Copilot cloud agent
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  rerun-once:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 &&
      contains(fromJSON('["Copilot","github-copilot[bot]"]'), github.event.workflow_run.actor.login)
    runs-on: ubuntu-latest
    steps:
      - name: Re-run failed jobs once
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh api --method POST "/repos/$REPO/actions/runs/$RUN_ID/rerun-failed-jobs"
