name: Retry Copilot cloud agent failures

"on":
  workflow_run:
    workflows:
      - Running Copilot cloud agent
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  rerun-once:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.actor.id == 198982749
    runs-on: ubuntu-latest
    steps:
      - name: Re-run only transient pr_summary failures
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if ! FAILED_LOGS="$(gh run view "$RUN_ID" --repo "$REPO" --log-failed 2>&1)"; then
            echo "Failed to fetch failed logs; skipping rerun to avoid broad retries."
            printf '%s\n' "$FAILED_LOGS"
            exit 0
          fi
          if printf '%s' "$FAILED_LOGS" | grep -Fq "Failed to send pr_summary after 3 attempts"; then
            gh api --method POST "/repos/$REPO/actions/runs/$RUN_ID/rerun-failed-jobs"
            echo "Requested rerun for transient pr_summary failure."
          else
            echo "No transient pr_summary failure detected; not rerunning."
          fi
